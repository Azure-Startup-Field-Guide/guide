<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="title">Asynchronous AI application reference architecture</title>
  <desc id="desc">A client submits a job to an API. The API writes to a managed queue. A worker processes the job with a Microsoft Foundry model, writes results to a managed store, and emits telemetry to Azure Monitor.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <text x="340" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Asynchronous AI workload</text>
  <rect x="26" y="70" width="105" height="58" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="78" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a1b">Client</text>
  <text x="78" y="112" text-anchor="middle" font-size="9" fill="#555">Submit and retrieve</text>
  <rect x="168" y="70" width="112" height="58" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="224" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">API</text>
  <text x="224" y="112" text-anchor="middle" font-size="9" fill="#555">Authenticate and create job</text>
  <rect x="318" y="70" width="112" height="58" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="374" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5900">Managed queue</text>
  <text x="374" y="112" text-anchor="middle" font-size="9" fill="#555">Buffer and retry</text>
  <rect x="468" y="70" width="112" height="58" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="524" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">Worker</text>
  <text x="524" y="112" text-anchor="middle" font-size="9" fill="#555">Bounded concurrency</text>
  <line x1="131" y1="99" x2="168" y2="99" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="99" x2="318" y2="99" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="99" x2="468" y2="99" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="188" y="200" width="150" height="64" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="263" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a2758">Managed result store</text>
  <text x="263" y="244" text-anchor="middle" font-size="9" fill="#555">Status, output, and metadata</text>
  <rect x="430" y="200" width="190" height="64" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="525" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a2758">Microsoft Foundry model</text>
  <text x="525" y="244" text-anchor="middle" font-size="9" fill="#555">Quota and capacity verified</text>
  <line x1="500" y1="128" x2="300" y2="200" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="548" y1="128" x2="548" y2="200" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="224" y1="128" x2="250" y2="200" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="188" y="316" width="432" height="52" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="404" y="338" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">Azure Monitor</text>
  <text x="404" y="355" text-anchor="middle" font-size="9" fill="#555">Correlated API, queue, worker, model, and business telemetry</text>
  <line x1="224" y1="128" x2="300" y2="316" stroke="#666" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="524" y1="264" x2="500" y2="316" stroke="#666" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
</svg>
