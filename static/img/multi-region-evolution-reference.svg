<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="title">Evolution from a single Azure region to multiple regions</title>
  <desc id="desc">The left side shows a zone-aware application and data service in one region. The right side shows a global router serving two regional application stamps with an explicitly designed data replication path.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Multi-region is a recovery decision</text>
  <rect x="20" y="48" width="280" height="316" rx="12" fill="#f5f5f5" stroke="#666" stroke-width="1.5"/>
  <text x="160" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Stage 1: one region</text>
  <text x="160" y="92" text-anchor="middle" font-size="9" fill="#555">Availability zones where supported</text>
  <rect x="50" y="118" width="220" height="116" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="160" y="143" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">Primary region</text>
  <rect x="72" y="164" width="78" height="46" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="111" y="191" text-anchor="middle" font-size="9" fill="#7a5900">App</text>
  <rect x="170" y="164" width="78" height="46" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="209" y="191" text-anchor="middle" font-size="9" fill="#4a2758">Data</text>
  <line x1="150" y1="187" x2="170" y2="187" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="50" y="272" width="220" height="54" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="160" y="294" text-anchor="middle" font-size="10" font-weight="bold" fill="#2d5a1b">Backup and recovery</text>
  <text x="160" y="312" text-anchor="middle" font-size="9" fill="#555">Tested against RTO and RPO</text>
  <line x1="209" y1="234" x2="190" y2="272" stroke="#666" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="330" y="48" width="330" height="316" rx="12" fill="#f5f5f5" stroke="#666" stroke-width="1.5"/>
  <text x="495" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Stage 2: multiple regions</text>
  <text x="495" y="92" text-anchor="middle" font-size="9" fill="#555">Only when targets justify the operating cost</text>
  <rect x="420" y="108" width="150" height="46" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="495" y="136" text-anchor="middle" font-size="10" font-weight="bold" fill="#2d5a1b">Global traffic routing</text>
  <rect x="350" y="196" width="135" height="105" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="417" y="219" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a3a5c">Region A</text>
  <text x="417" y="243" text-anchor="middle" font-size="9" fill="#555">App stamp</text>
  <text x="417" y="263" text-anchor="middle" font-size="9" fill="#555">Data role A</text>
  <text x="417" y="283" text-anchor="middle" font-size="8" fill="#555">Active or passive</text>
  <rect x="505" y="196" width="135" height="105" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="572" y="219" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a3a5c">Region B</text>
  <text x="572" y="243" text-anchor="middle" font-size="9" fill="#555">App stamp</text>
  <text x="572" y="263" text-anchor="middle" font-size="9" fill="#555">Data role B</text>
  <text x="572" y="283" text-anchor="middle" font-size="8" fill="#555">Active or passive</text>
  <line x1="470" y1="154" x2="417" y2="196" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="154" x2="572" y2="196" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="485" y1="260" x2="505" y2="260" stroke="#9673a6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="505" y1="280" x2="485" y2="280" stroke="#9673a6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="495" y="329" text-anchor="middle" font-size="9" font-weight="bold" fill="#4a2758">Explicit replication, failover, and conflict behavior</text>
</svg>
