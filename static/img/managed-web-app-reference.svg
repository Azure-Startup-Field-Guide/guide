<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="title">Managed web application reference architecture</title>
  <desc id="desc">Users connect through a managed edge to managed application compute, which uses managed identity to access Key Vault and a managed data service. GitHub Actions deploys through workload identity federation, and Azure Monitor receives telemetry.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect x="18" y="18" width="644" height="354" rx="12" fill="#f5f5f5" stroke="#666" stroke-width="1.5"/>
  <text x="340" y="43" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Production workload boundary</text>
  <rect x="40" y="78" width="120" height="56" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="100" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a1b">Users</text>
  <text x="100" y="118" text-anchor="middle" font-size="10" fill="#555">Web or API clients</text>
  <rect x="210" y="78" width="150" height="56" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="285" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">Managed edge</text>
  <text x="285" y="118" text-anchor="middle" font-size="10" fill="#555">Routing and protection</text>
  <rect x="410" y="70" width="210" height="72" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="515" y="97" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5900">Managed app compute</text>
  <text x="515" y="116" text-anchor="middle" font-size="10" fill="#555">App Service or Container Apps</text>
  <text x="515" y="130" text-anchor="middle" font-size="9" fill="#555">Managed identity enabled</text>
  <line x1="160" y1="106" x2="210" y2="106" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="106" x2="410" y2="106" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="410" y="200" width="96" height="58" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="458" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a2758">Key Vault</text>
  <text x="458" y="242" text-anchor="middle" font-size="9" fill="#555">Secrets and keys</text>
  <rect x="524" y="200" width="96" height="58" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="572" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a2758">Managed data</text>
  <text x="572" y="242" text-anchor="middle" font-size="9" fill="#555">Selected by access pattern</text>
  <line x1="482" y1="142" x2="458" y2="200" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="548" y1="142" x2="572" y2="200" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="292" width="190" height="54" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="135" y="314" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d5a1b">GitHub Actions</text>
  <text x="135" y="332" text-anchor="middle" font-size="9" fill="#555">OIDC workload identity federation</text>
  <rect x="410" y="292" width="210" height="54" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="515" y="314" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">Azure Monitor</text>
  <text x="515" y="332" text-anchor="middle" font-size="9" fill="#555">Logs, metrics, traces, and alerts</text>
  <line x1="230" y1="319" x2="410" y2="126" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="515" y1="142" x2="515" y2="292" stroke="#666" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
</svg>
