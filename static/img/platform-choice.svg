<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 455" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Choose the smallest Azure platform that meets the workload requirements</title>
  <desc id="desc">A decision tree routes web applications, event-driven tasks, containers, and explicit Kubernetes requirements to suitable starting services.</desc>
  <defs>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
    <style>
      .title { fill: #1a3a5c; }
      .label { fill: #222222; }
      .detail { fill: #555555; }
      .yes { fill: none; stroke: #2e7d32; stroke-width: 2; marker-end: url(#green-arrow); }
      .no { fill: none; stroke: #c62828; stroke-width: 2; marker-end: url(#red-arrow); }
      @media (prefers-color-scheme: dark) {
        .title { fill: #c9e2ff; }
        .label { fill: #f2f2f2; }
        .detail { fill: #d0d0d0; }
      }
    </style>
  </defs>

  <text x="340" y="27" text-anchor="middle" font-size="16" font-weight="bold" class="title">Choose the smallest platform that fits</text>
  <text x="340" y="46" text-anchor="middle" font-size="10" class="detail">Start with requirements, not the service you expect to need someday</text>

  <rect x="170" y="62" width="340" height="60" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="340" y="86" text-anchor="middle" font-size="12" font-weight="bold" class="label">Do you require the Kubernetes API, operators,</text>
  <text x="340" y="103" text-anchor="middle" font-size="12" font-weight="bold" class="label">specialized scheduling, or an existing K8s platform?</text>

  <path d="M 250 122 L 130 157" class="yes"/>
  <text x="184" y="135" font-size="10" font-weight="bold" fill="#2e7d32">YES</text>
  <path d="M 430 122 L 525 147" class="no"/>
  <text x="474" y="135" font-size="10" font-weight="bold" fill="#c62828">NO</text>

  <rect x="20" y="162" width="220" height="72" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="130" y="189" text-anchor="middle" font-size="12" font-weight="bold" class="label">Azure Kubernetes Service</text>
  <text x="130" y="210" text-anchor="middle" font-size="10" class="detail">Accept the operational model</text>
  <text x="130" y="224" text-anchor="middle" font-size="10" class="detail">because requirements justify it</text>

  <rect x="390" y="152" width="270" height="62" rx="8" fill="#fff3e0" stroke="#d6b656" stroke-width="2"/>
  <text x="525" y="178" text-anchor="middle" font-size="12" font-weight="bold" class="label">Is the workload containerized?</text>
  <text x="525" y="198" text-anchor="middle" font-size="10" class="detail">Without a direct Kubernetes need</text>

  <path d="M 470 214 L 375 251" class="yes"/>
  <text x="420" y="230" font-size="10" font-weight="bold" fill="#2e7d32">YES</text>
  <path d="M 585 214 L 585 246" class="no"/>
  <text x="594" y="234" font-size="10" font-weight="bold" fill="#c62828">NO</text>

  <rect x="255" y="256" width="230" height="72" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="370" y="283" text-anchor="middle" font-size="12" font-weight="bold" class="label">Azure Container Apps</text>
  <text x="370" y="304" text-anchor="middle" font-size="10" class="detail">Managed container platform</text>
  <text x="370" y="318" text-anchor="middle" font-size="10" class="detail">without cluster operations</text>

  <rect x="505" y="251" width="155" height="62" rx="8" fill="#fff3e0" stroke="#d6b656" stroke-width="2"/>
  <text x="582" y="277" text-anchor="middle" font-size="11.5" font-weight="bold" class="label">Event-driven</text>
  <text x="582" y="294" text-anchor="middle" font-size="11.5" font-weight="bold" class="label">or scheduled?</text>

  <path d="M 552 313 L 448 340" class="yes"/>
  <text x="500" y="328" font-size="10" font-weight="bold" fill="#2e7d32">YES</text>
  <path d="M 613 313 L 593 340" class="no"/>
  <text x="620" y="329" font-size="10" font-weight="bold" fill="#c62828">NO</text>

  <rect x="380" y="345" width="135" height="56" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="447" y="370" text-anchor="middle" font-size="11" font-weight="bold" class="label">Azure Functions</text>
  <text x="447" y="388" text-anchor="middle" font-size="9" class="detail">Events, jobs, schedules</text>

  <rect x="525" y="345" width="135" height="56" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="592" y="370" text-anchor="middle" font-size="11" font-weight="bold" class="label">Azure App Service</text>
  <text x="592" y="388" text-anchor="middle" font-size="9" class="detail">Web apps and APIs</text>

  <rect x="20" y="414" width="640" height="32" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
  <text x="340" y="427" text-anchor="middle" font-size="9.5" font-weight="bold" class="label">For every path</text>
  <text x="340" y="440" text-anchor="middle" font-size="8.5" class="detail">Region, quota, compliance | Infrastructure as code | Managed identity | Telemetry, rollback, owner | Revisit trigger</text>
</svg>
