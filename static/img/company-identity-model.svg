<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">From individual credit activation to company-controlled Azure</title>
  <desc id="desc">The personal Microsoft account activates credits, while company identities and a second administrator provide resilient control of the tenant and subscription.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
    <style>
      .title { fill: #1a3a5c; }
      .label { fill: #222222; }
      .detail { fill: #555555; }
      .line { fill: none; stroke: #666666; stroke-width: 2; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 5 4; }
      @media (prefers-color-scheme: dark) {
        .title { fill: #c9e2ff; }
        .label { fill: #f2f2f2; }
        .detail { fill: #d0d0d0; }
        .line { stroke: #b8b8b8; }
      }
    </style>
  </defs>

  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="bold" class="title">Individual activation, company control</text>
  <text x="340" y="47" text-anchor="middle" font-size="10" class="detail">Keep the required activation identity, then remove the single-person dependency</text>

  <rect x="20" y="70" width="190" height="115" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="115" y="94" text-anchor="middle" font-size="12" font-weight="bold" class="label">Activation identity</text>
  <circle cx="115" cy="125" r="19" fill="#d6b656"/>
  <circle cx="115" cy="120" r="6" fill="#ffffff"/>
  <path d="M 104 137 Q 115 128 126 137" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <text x="115" y="160" text-anchor="middle" font-size="10" class="detail">Personal Microsoft account</text>
  <text x="115" y="174" text-anchor="middle" font-size="10" class="detail">used to redeem the offer</text>

  <rect x="250" y="70" width="410" height="275" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="455" y="96" text-anchor="middle" font-size="14" font-weight="bold" class="title">Company-backed Microsoft Entra tenant</text>

  <path d="M 210 127 H 270" class="line"/>
  <text x="240" y="116" text-anchor="middle" font-size="9" class="detail">activates</text>

  <rect x="280" y="120" width="150" height="78" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="355" y="143" text-anchor="middle" font-size="11" font-weight="bold" class="label">Sponsored subscription</text>
  <text x="355" y="163" text-anchor="middle" font-size="10" class="detail">Credits and workloads</text>
  <text x="355" y="178" text-anchor="middle" font-size="10" class="detail">stay in the expected context</text>

  <rect x="470" y="120" width="160" height="78" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="550" y="143" text-anchor="middle" font-size="11" font-weight="bold" class="label">Verified company domain</text>
  <text x="550" y="163" text-anchor="middle" font-size="10" class="detail">Company users and</text>
  <text x="550" y="178" text-anchor="middle" font-size="10" class="detail">organizational identity</text>

  <path d="M 430 159 H 470" class="line dashed"/>
  <text x="450" y="150" text-anchor="middle" font-size="9" class="detail">linked</text>

  <rect x="280" y="235" width="150" height="78" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="355" y="258" text-anchor="middle" font-size="11" font-weight="bold" class="label">Second administrator</text>
  <text x="355" y="278" text-anchor="middle" font-size="10" class="detail">Independent access and</text>
  <text x="355" y="293" text-anchor="middle" font-size="10" class="detail">lockout recovery path</text>

  <rect x="470" y="235" width="160" height="78" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="550" y="258" text-anchor="middle" font-size="11" font-weight="bold" class="label">Company team identities</text>
  <text x="550" y="278" text-anchor="middle" font-size="10" class="detail">Daily access uses company</text>
  <text x="550" y="293" text-anchor="middle" font-size="10" class="detail">accounts and least privilege</text>

  <path d="M 355 235 V 198" class="line"/>
  <path d="M 550 235 V 198" class="line"/>

  <rect x="65" y="235" width="150" height="78" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="140" y="258" text-anchor="middle" font-size="11" font-weight="bold" class="label">Avoid this state</text>
  <text x="140" y="278" text-anchor="middle" font-size="10" class="detail">One personal account is</text>
  <text x="140" y="293" text-anchor="middle" font-size="10" class="detail">the only admin and owner</text>

  <path d="M 115 185 V 235" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <rect x="145" y="360" width="390" height="22" rx="11" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
  <text x="340" y="375" text-anchor="middle" font-size="10" font-weight="bold" class="detail">Test both administrator paths before deploying production workloads</text>
</svg>
