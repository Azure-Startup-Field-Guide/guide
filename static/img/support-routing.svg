<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Route an Azure startup problem to the right support channel</title>
  <desc id="desc">A three-path routing diagram maps program and benefit issues, Azure service issues, and architecture guidance to the appropriate Microsoft support channel.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
    <style>
      .title { fill: #1a3a5c; }
      .label { fill: #222222; }
      .detail { fill: #555555; }
      .line { fill: none; stroke: #666666; stroke-width: 1.7; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #666666; stroke-width: 1.7; }
      @media (prefers-color-scheme: dark) {
        .title { fill: #c9e2ff; }
        .label { fill: #f2f2f2; }
        .detail { fill: #d0d0d0; }
        .line { stroke: #b8b8b8; }
        .branch { stroke: #b8b8b8; }
      }
    </style>
  </defs>

  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="bold" class="title">Route the problem, do not recreate the environment</text>
  <text x="340" y="47" text-anchor="middle" font-size="10" class="detail">Use the channel that owns the problem you are trying to solve</text>

  <rect x="210" y="65" width="260" height="58" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="340" y="89" text-anchor="middle" font-size="12" font-weight="bold" class="label">What kind of help do you need?</text>
  <text x="340" y="108" text-anchor="middle" font-size="10" class="detail">Capture the exact error, affected resource, and business impact</text>

  <path d="M 340 123 V 145 M 120 145 H 560" class="branch"/>
  <path d="M 120 145 V 165" class="line"/>
  <path d="M 340 145 V 165" class="line"/>
  <path d="M 560 145 V 165" class="line"/>

  <rect x="25" y="170" width="190" height="80" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="120" y="195" text-anchor="middle" font-size="11.5" font-weight="bold" class="label">Program, portal,</text>
  <text x="120" y="211" text-anchor="middle" font-size="11.5" font-weight="bold" class="label">or benefit</text>
  <text x="120" y="230" text-anchor="middle" font-size="10" class="detail">Application, activation,</text>
  <text x="120" y="244" text-anchor="middle" font-size="10" class="detail">entitlement, or ownership</text>

  <rect x="245" y="170" width="190" height="80" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="340" y="195" text-anchor="middle" font-size="11.5" font-weight="bold" class="label">Azure service</text>
  <text x="340" y="211" text-anchor="middle" font-size="11.5" font-weight="bold" class="label">or billing issue</text>
  <text x="340" y="230" text-anchor="middle" font-size="10" class="detail">Error, quota, billing,</text>
  <text x="340" y="244" text-anchor="middle" font-size="10" class="detail">outage, or urgent impact</text>

  <rect x="465" y="170" width="190" height="80" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="560" y="195" text-anchor="middle" font-size="11.5" font-weight="bold" class="label">Architecture</text>
  <text x="560" y="211" text-anchor="middle" font-size="11.5" font-weight="bold" class="label">or optimization</text>
  <text x="560" y="230" text-anchor="middle" font-size="10" class="detail">How to build, migrate,</text>
  <text x="560" y="244" text-anchor="middle" font-size="10" class="detail">scale, secure, or improve</text>

  <path d="M 120 250 V 285" class="line"/>
  <path d="M 340 250 V 285" class="line"/>
  <path d="M 560 250 V 285" class="line"/>

  <rect x="25" y="290" width="190" height="82" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="120" y="315" text-anchor="middle" font-size="11.5" font-weight="bold" class="label">Microsoft for Startups</text>
  <text x="120" y="331" text-anchor="middle" font-size="11.5" font-weight="bold" class="label">Program Support</text>
  <text x="120" y="350" text-anchor="middle" font-size="10" class="detail">Use Get program support</text>
  <text x="120" y="364" text-anchor="middle" font-size="10" class="detail">from your startup homepage</text>

  <rect x="245" y="290" width="190" height="82" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="340" y="315" text-anchor="middle" font-size="11.5" font-weight="bold" class="label">Azure support</text>
  <text x="340" y="331" text-anchor="middle" font-size="11.5" font-weight="bold" class="label">request</text>
  <text x="340" y="350" text-anchor="middle" font-size="10" class="detail">Include IDs, timestamps,</text>
  <text x="340" y="364" text-anchor="middle" font-size="10" class="detail">reproduction, and impact</text>

  <rect x="465" y="290" width="190" height="82" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="560" y="315" text-anchor="middle" font-size="11.5" font-weight="bold" class="label">Request an Azure Advisor</text>
  <text x="560" y="331" text-anchor="middle" font-size="9" font-weight="bold" class="detail">(human technical guidance)</text>
  <text x="560" y="350" text-anchor="middle" font-size="10" class="detail">Use the technical guidance</text>
  <text x="560" y="364" text-anchor="middle" font-size="10" class="detail">path in your startup experience</text>

  <rect x="125" y="395" width="430" height="28" rx="14" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="340" y="408" text-anchor="middle" font-size="10" font-weight="bold" class="label">Public, non-sensitive technical question? Microsoft Q&amp;A: Azure Startups</text>
</svg>
